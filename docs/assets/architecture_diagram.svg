      <text x="12" y="40" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748B">• Primary key uniqueness</text>
      <text x="12" y="58" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748B">• Domain boundary checks</text>
